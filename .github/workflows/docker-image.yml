name: Generate Downloadable Artifacts (nginx image)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    # run actions manually
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'


jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      id: build_image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        tags: nginx:${{ github.sha }}
        outputs: type=docker,dest=./nginx-image.tar
    
    - name: Compress Docker image
      run: |
        gzip -c ./nginx-image.tar > nginx-image-${{ github.sha }}.tar.gz
        rm ./nginx-image.tar
        echo "IMAGE_NAME=nginx-image-${{ github.sha }}.tar.gz" >> $GITHUB_ENV
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: nginx-docker-image
        path: ${{ env.IMAGE_NAME }}
        retention-days: 7
